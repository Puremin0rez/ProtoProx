[versions]
kotlin = "2.4.21"
# Netty and SLF4J from Minecraft 1.20.1
netty = "4.1.82.Final"
slf4j = "2.0.1"
netty-haproxy = "4.2.19.Final"
mixin = "0.17.4+mixin.0.8.7"
asm = "9.11"
junit = "6.1.3"

[libraries]
netty-codec = { module = "io.netty:netty-codec", version.ref = "netty" }
netty-codec-haproxy = { module = "io.netty:netty-codec-haproxy", version.ref = "netty-haproxy" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
mixin = { module = "net.fabricmc:sponge-mixin", version.ref = "mixin" }
asm-tree = { module = "org.ow2.asm:asm-tree", version.ref = "asm" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version = "0.27.0" }
